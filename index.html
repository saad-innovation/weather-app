<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather App</title>
    <meta name="title" content="Modern Weather App | Developed by Saad Ali">
    <meta name="description" content="A real-time weather forecasting application featuring a modern glassmorphism UI. Built with HTML, CSS, JavaScript, and API integration by Saad Ali.">
    <meta name="keywords" content="Saad Ali, Weather App, Frontend Developer, Glassmorphism UI, JavaScript API Integration, Sargodha">
    <meta name="author" content="Saad Ali">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                aria-label="City Name"
                autocomplete="off"
            >
            <!-- Note: Yahan se onclick hata diya hy kyunke pichli JS mai humne Event Listener laga diya tha -->
            <button id="searchBtn">
                Search
            </button>
        </div>

        <div id="loading" aria-live="polite">Fetching weather...</div>
        <div id="result" aria-live="polite">
            <!-- Javascript yahan weather data inject karega -->
        </div>
        
        <!-- Yahan apka signature add kiya gaya hy -->
        <div class="creator-tag">
            Developed by <span>Saad Ali</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
