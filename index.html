<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                aria-label="City Name"
                autocomplete="off"
            >
            <!-- Note: Yahan se onclick hata diya hy kyunke pichli JS mai humne Event Listener laga diya tha -->
            <button id="searchBtn">
                Search
            </button>
        </div>

        <div id="loading" aria-live="polite">Fetching weather...</div>
        <div id="result" aria-live="polite">
            <!-- Javascript yahan weather data inject karega -->
        </div>
        
        <!-- Yahan apka signature add kiya gaya hy -->
        <div class="creator-tag">
            Developed by <span>Saad Ali</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
